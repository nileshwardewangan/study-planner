<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Exam & Daily Study Planner FINAL</title>

<style>
body{font-family:Arial;background:#eef2f7;padding:15px}
.wrapper{display:grid;grid-template-columns:2.3fr 1.4fr;gap:15px}
.box{background:#fff;padding:15px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.1)}
h2{text-align:center;margin:6px 0}

/* Today DAY name blink */
.todayDay{
  background:#bbf7d0 !important;
  animation:blink 1.2s infinite;
}


/* ===== BIG DAILY CALENDAR ===== */
.month{margin-top:15px}
.month h3{text-align:center;background:#e0e7ff;padding:6px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day-name,.day{border:1px solid #ddd;min-height:95px;padding:4px;font-size:11px}
.day-name{text-align:center;font-weight:bold;background:#f8fafc}
.today{background:#dcfce7;animation:blink 1.2s infinite}
.sunday{background:#fee2e2}
.note{background:#2563eb;color:#fff;font-size:10px;padding:3px 5px;border-radius:5px;margin-top:3px}
.revision{background:#0f766e}
.examMark{background:#ef4444;color:#fff;font-size:9px;padding:1px 4px;border-radius:4px}
@keyframes blink{50%{box-shadow:0 0 8px #22c55e}}

/* ===== MINI EXAM CALENDAR ===== */
.miniMonth{margin-top:8px}
.miniTitle{text-align:center;font-size:12px;font-weight:bold;margin:4px 0}
.miniCal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.miniDay{padding:6px;font-size:11px;text-align:center;border-radius:5px;background:#f3f4f6}
.miniUpcoming{background:#bbf7d0}
.miniNearest{background:#22c55e;color:#fff;animation:blink 1s infinite}
.miniPast{background:#fecaca}

/* ===== TIMETABLE ===== */
select,input,button{width:100%;padding:6px;margin-top:5px}
button{background:#4f46e5;color:#fff;border:none;border-radius:6px;cursor:pointer}
.slot{background:#e5e7eb;padding:6px;margin-top:6px;border-radius:6px;font-size:12px}
.activeSlot{background:#bbf7d0;animation:blink 1s infinite}

/* ===== EXAMS ===== */
.exam{background:#f1f1f1;padding:8px;margin-top:8px;border-radius:6px}
.exam.applied{border-left:5px solid #9ca3af}
.exam.upcoming{border-left:5px solid #22c55e}
.exam.over{border-left:5px solid #ef4444}

.examBtn{border:none;font-size:11px;padding:3px 6px;border-radius:6px;cursor:pointer;margin-right:4px}
.examBtn.edit{background:#fde68a}
.examBtn.del{background:#fecaca}

/* ==== SMALL CUTE EDIT / DELETE ==== */
.slot .examBtn{
  font-size:10px;        /* chhota icon */
  padding:2px 5px;      /* compact */
  border-radius:50%;    /* cute round */
  line-height:1;
}

.slot .examBtn.edit{
  background:#fde68a;
}

.slot .examBtn.del{
  background:#fecaca;
}

.slot .examBtn:hover{
  transform:scale(1.1);
}

/* ===== TIMETABLE BUTTON FIX ===== */
.slot{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.slotText{
  flex:1;
}

.slotBtns{
  display:flex;
  gap:4px;
}

/* chhote + cute icons */
.slot .examBtn{
  font-size:10px;
  padding:2px 5px;
  border-radius:50%;
  line-height:1;
}

#totalFees{position:fixed;bottom:20px;right:20px;background:#22c55e;color:#fff;padding:10px 16px;border-radius:10px;font-weight:bold}
#yearBox{position:fixed;bottom:60px;right:20px;background:#fff;padding:10px;border-radius:10px}
#yearBox td,#yearBox th{border:1px solid #ccc;padding:4px 8px;font-size:12px}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT -->
<div class="box">
<h2>📅 Daily Study & Revision (6 Months)</h2>
<div id="calendar"></div>

<hr>
<h2>⏰ Timetable</h2>
<select id="day">
<option>Sunday</option><option>Monday</option><option>Tuesday</option>
<option>Wednesday</option><option>Thursday</option>
<option>Friday</option><option>Saturday</option>
</select>
<input type="time" id="from">
<input type="time" id="to">
<input id="activity" placeholder="Activity">
<button onclick="addSlot()">➕ Add Slot</button>
<div id="slots"></div>
</div>

<!-- RIGHT -->
<div class="box">
<h2>📘 Exam Manager</h2>
<input id="examName" placeholder="Exam Name">
<input id="examDate" type="date">
<input id="examFees" type="number" placeholder="Fees ₹">
<button onclick="addExam()">Add Exam</button>

<hr>
<h3>🟡 Applied</h3><div id="applied"></div>
<h3>🟢 Upcoming</h3><div id="upcoming"></div>
<h3>🔴 Exam Over</h3><div id="over"></div>

<hr>
<h3>📅 Exam Calendar (Upcoming Month)</h3>
<div id="miniCalendar"></div>
</div>

</div>

<div id="totalFees">₹0</div>

<div id="yearBox">
<b>📊 Year-wise</b>
<table id="yearTable">
<tr><th>Year</th><th>Count</th></tr>
</table>
</div>

<script>
const load=k=>JSON.parse(localStorage.getItem(k))||[];
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const ds = d => {
  let y = d.getFullYear();
  let m = String(d.getMonth()+1).padStart(2,"0");
  let day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};

const REVISION_DAYS=[1,3,7,15,30,60,90,180];

let notes=JSON.parse(localStorage.getItem("dailyNotes"))||{};
let revisionMap=JSON.parse(localStorage.getItem("revisionMap"))||{};

/* ===== BIG CALENDAR (6 MONTH) ===== */
function renderCalendar(){
 calendar.innerHTML="";
 let exams=load("exams").map(e=>e.date);
 let today=ds(new Date());
 
  let realToday = new Date();
  let todayIndex = realToday.getDay();
  let currentMonth = realToday.getMonth();
  let currentYear = realToday.getFullYear();

 for(let m=0;m<6;m++){
  let f=new Date();f.setMonth(f.getMonth()+m,1);
  let div=document.createElement("div");
  div.className="month";
  div.innerHTML=`<h3>${f.toLocaleString("en-IN",{month:"long",year:"numeric"})}</h3>`;
  let g=document.createElement("div");g.className="grid";
  

days.forEach((d,i)=>{
  let cls="day-name";

  if(
    f.getMonth()===currentMonth &&
    f.getFullYear()===currentYear &&
    i===todayIndex
  ){
    cls+=" todayDay";
  }

  g.innerHTML+=`<div class="${cls}">${d.slice(0,3)}</div>`;
});


  for(let i=0;i<f.getDay();i++) g.innerHTML+="<div></div>";
  let total=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();

  for(let d=1;d<=total;d++){
   let cd=new Date(f.getFullYear(),f.getMonth(),d);
   let date=ds(cd);
   let cls="day"+(date===today?" today":"")+(cd.getDay()===0?" sunday":"");
   g.innerHTML+=`
   <div class="${cls}" onclick="addNote('${date}')">
    <b>${d}</b><br>
    ${exams.includes(date)?'<span class="examMark">EXAM</span>':""}
    ${notes[date]?`<div class="note">📖 ${notes[date]}</div>`:""}
    ${revisionMap[date]?revisionMap[date].map(r=>`<div class="note revision">🔁 ${r.day}D<br>${r.topic}</div>`).join(""):""}
   </div>`;
  }
  div.appendChild(g);
  calendar.appendChild(div);
 }
}

/* ===== MINI CALENDAR (3 MONTH) ===== */
function renderMiniCalendar(){
 miniCalendar.innerHTML="";
 let exams=load("exams").filter(e=>e.date);
 if(exams.length===0){miniCalendar.innerHTML="No exams";return;}

 let today=new Date();
 let nearest=exams.map(e=>new Date(e.date)).filter(d=>d>=today).sort((a,b)=>a-b)[0];

 for(let m=0;m<5;m++){
  let base=new Date();base.setMonth(base.getMonth()+m,1);
  let y=base.getFullYear(),mo=base.getMonth();
  let total=new Date(y,mo+1,0).getDate();

  miniCalendar.innerHTML+=`<div class="miniMonth">
   <div class="miniTitle">${base.toLocaleString("en-IN",{month:"short",year:"numeric"})}</div>
   <div class="miniCal" id="mc${m}"></div>
  </div>`;

  let grid=document.getElementById("mc"+m);

  for(let d=1;d<=total;d++){
   let cur=new Date(y,mo,d);
   let cls="miniDay";
   exams.forEach(e=>{
    let ed=new Date(e.date);
    if(ds(ed)===ds(cur)){
     cls=ed<today?"miniPast":"miniUpcoming";
     if(nearest && ds(ed)===ds(nearest)) cls="miniNearest";
    }
   });
   grid.innerHTML+=`<div class="${cls}">${d}</div>`;
  }
 }
}

/* ===== STUDY ===== */
function addNote(date){
 let old=notes[date]||"";
 let text=prompt("Aaj kya padha?",old);
 if(text===null||text.trim()==="") return;
 notes[date]=text;

 Object.keys(revisionMap).forEach(d=>{
  revisionMap[d]=revisionMap[d].filter(r=>r.from!==date);
  if(revisionMap[d].length===0) delete revisionMap[d];
 });

 REVISION_DAYS.forEach(day=>{
  let rd = new Date(date);
  rd.setDate(rd.getDate() + day);

  // ❌ Sunday ko skip / shift
  if(rd.getDay() === 0){        // 0 = Sunday
    rd.setDate(rd.getDate() + 1); // shift to Monday
  }

  let rds = ds(rd);

  if(!revisionMap[rds]) revisionMap[rds] = [];
  revisionMap[rds].push({
    from: date,
    topic: text,
    day: day
  });
});


 localStorage.setItem("dailyNotes",JSON.stringify(notes));
 localStorage.setItem("revisionMap",JSON.stringify(revisionMap));
 renderCalendar();
}

/* ===== EXAMS ===== */
function addExam(){
 let e=load("exams");
 e.push({name:examName.value,date:examDate.value||null,fees:+examFees.value||0,year:new Date().getFullYear()});
 save("exams",e);examName.value=examDate.value=examFees.value="";
 renderExams();
}

function renderExams(){
 applied.innerHTML=upcoming.innerHTML=over.innerHTML="";
 let exams=load("exams"),today=new Date(),total=0,yr={};

 exams.sort((a,b)=>!a.date?1:!b.date?-1:new Date(a.date)-new Date(b.date));

 exams.forEach((e,i)=>{
  total+=e.fees;yr[e.year]=(yr[e.year]||0)+1;
  let status="applied";if(e.date) status=new Date(e.date)<today?"over":"upcoming";
  let daysLeft = "";
if(e.date){
  let diff = Math.ceil((new Date(e.date) - today) / 86400000);
  daysLeft = diff < 0 ? "❌ Exam Over" : `⏳ ${diff} Days Left`;
}

  let card=`<div class="exam ${status}">
  <b>${e.name}</b><br>
  ${e.date||"Date Awaited"}<br>
  ${daysLeft ? `<small>${daysLeft}</small><br>` : ""}
  <button class="examBtn edit" onclick="editExam(${i})">✏️</button>
  <button class="examBtn del" onclick="deleteExam(${i})">🗑</button>
</div>`;

  if(status==="applied") applied.innerHTML+=card;
  else if(status==="over") over.innerHTML+=card;
  else upcoming.innerHTML+=card;
 });

 totalFees.innerText="₹"+total;
 yearTable.innerHTML="<tr><th>Year</th><th>Count</th></tr>";
 for(let y in yr) yearTable.innerHTML+=`<tr><td>${y}</td><td>${yr[y]}</td></tr>`;

 renderCalendar();
 renderMiniCalendar();
}

function editExam(i){
 let exams=load("exams");
 let d=prompt("Exam date (YYYY-MM-DD):",exams[i].date||"");
 if(!d) return;
 exams[i].date=d;save("exams",exams);renderExams();
}
function deleteExam(i){
 if(!confirm("Delete exam?")) return;
 let exams=load("exams");
 exams.splice(i,1);save("exams",exams);renderExams();
}

/* ===== TIMETABLE ===== */
function addSlot(){
 let s=load("slots");
 s.push({day:day.value,from:from.value,to:to.value,act:activity.value});
 save("slots",s);renderSlots();
}
function renderSlots(){
  slots.innerHTML="";
  let now=new Date(),
      d=days[now.getDay()],
      t=now.toTimeString().slice(0,5);

  load("slots")
   .map((x,i)=>({...x,i}))
   .filter(x=>x.day===d)
   .forEach(x=>{
     let active = t>=x.from && t<=x.to;

     slots.innerHTML+=`
      <div class="slot ${active?"activeSlot":""}">
        <div class="slotText">
          <b>${x.from}–${x.to}</b> ${x.act}
        </div>
        <div class="slotBtns">
          <button class="examBtn edit" onclick="editSlot(${x.i})">✏️</button>
          <button class="examBtn del" onclick="deleteSlot(${x.i})">🗑</button>
        </div>
      </div>`;
   });
}

function editSlot(i){
 let s=load("slots");
 let from=prompt("From (HH:MM):",s[i].from); if(!from) return;
 let to=prompt("To (HH:MM):",s[i].to); if(!to) return;
 let act=prompt("Activity:",s[i].act); if(!act) return;
 s[i]={...s[i],from,to,act};
 save("slots",s);
 renderSlots();
}

function deleteSlot(i){
 if(!confirm("Delete slot?")) return;
 let s=load("slots");
 s.splice(i,1);
 save("slots",s);
 renderSlots();
}
function editSlot(i){
  let s = load("slots");

  let from = prompt("From (HH:MM)", s[i].from);
  if(!from) return;

  let to = prompt("To (HH:MM)", s[i].to);
  if(!to) return;

  let act = prompt("Activity", s[i].act);
  if(!act) return;

  s[i].from = from;
  s[i].to   = to;
  s[i].act  = act;

  save("slots", s);
  renderSlots();
}

function deleteSlot(i){
  if(!confirm("Delete slot?")) return;

  let s = load("slots");
  s.splice(i,1);
  save("slots", s);
  renderSlots();
}

renderCalendar();renderExams();renderSlots();
setInterval(renderSlots,60000);
</script>

</body>
</html>
